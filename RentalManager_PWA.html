"20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="file-text" class="lucide lucide-file-text"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg><span class="text-[10px] capitalize">prop</span></button><button class="flex flex-col items-center gap-1 text-gray-500"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="users" class="lucide lucide-users"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><path d="M16 3.128a4 4 0 0 1 0 7.744"></path><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><circle cx="9" cy="7" r="4"></circle></svg><span class="text-[10px] capitalize">tena</span></button><button class="flex flex-col items-center gap-1 text-gray-500"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="file-text" class="lucide lucide-file-text"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg><span class="text-[10px] capitalize">invo</span></button></div></div></div>

    <script type="text/babel">
        // --- CONFIGURATION ---
        const firebaseConfig = window.__firebase_config ? JSON.parse(window.__firebase_config) : {
            apiKey: "PLACEHOLDER_API_KEY",
            authDomain: "placeholder.firebaseapp.com",
            projectId: "placeholder-id",
            storageBucket: "placeholder.appspot.com",
            messagingSenderId: "00000000000",
            appId: "1:00000000000:web:00000000000000"
        };
        
        let app, auth, db;
        try {
            if (window.firebase) {
                app = firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                db = firebase.firestore();
            }
        } catch (e) {
            console.error("Firebase Init Error:", e);
        }

        const appId = window.__app_id || 'default-app-id';
        const { useState, useEffect, useRef } = React;

        // --- ICONS ---
        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        // --- UTILS ---
        const callGemini = async (prompt) => {
            const apiKey = ""; 
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Could not generate text.";
            } catch (error) { return "Error connecting to AI service."; }
        };

        const useNepaliDate = () => {
            const [isLoaded, setIsLoaded] = useState(false);
            useEffect(() => { if (window.NepaliDate) setIsLoaded(true); }, []);
            const convertToBS = (dateString) => {
                if (!isLoaded || !dateString || !window.NepaliDate) return '';
                try {
                    const parts = dateString.split('-');
                    if (parts.length !== 3) return '';
                    const bsDate = new window.NepaliDate.default(new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2])));
                    return bsDate.format('D MMMM YYYY');
                } catch (e) { return ''; }
            };
            return { convertToBS };
        };

        const fileToBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        const copyToClipboard = (text) => {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => alert("Copied!")).catch(() => document.execCommand('copy'));
            } else {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert("Copied!");
            }
        };

        // --- COMPONENTS ---
        const DualDatePicker = ({ label, value, onChange }) => {
            const { convertToBS } = useNepaliDate();
            return (
                <div className="flex flex-col gap-1 w-full">
                    <label className="text-sm font-medium text-gray-700">{label}</label>
                    <div className="flex gap-2 items-center">
                        <input type="date" value={value} onChange={(e) => onChange(e.target.value)} className="p-2 border rounded-md focus:ring-2 focus:ring-indigo-500 w-full" />
                        <div className="bg-indigo-50 border border-indigo-100 p-2 rounded-md min-w-[120px] text-center">
                            <span className="text-xs text-indigo-600 font-bold block">Nepali Date</span>
                            <span className="text-sm font-medium text-indigo-800">{value ? convertToBS(value) : '-'}</span>
                        </div>
                    </div>
                </div>
            );
        };

        const FileUploader = ({ label, onUpload, currentFile, accept = "image/*" }) => {
            const fileInputRef = useRef(null);
            return (
                <div className="flex flex-col gap-2">
                    <label className="text-sm font-medium text-gray-700">{label}</label>
                    <div className="flex items-center gap-2">
                        <button onClick={() => fileInputRef.current.click()} className="flex items-center gap-2 px-3 py-2 bg-gray-100 hover:bg-gray-200 rounded-md text-sm transition">
                            <Icon name="upload" size={16}/> {currentFile ? "Change File" : "Upload File"}
                        </button>
                        {currentFile && <span className="text-xs text-green-600 font-medium flex items-center gap-1"><Icon name="check-circle" size={12}/> Uploaded</span>}
                    </div>
                    <input type="file" ref={fileInputRef} onChange={async (e) => {
                        const file = e.target.files[0];
                        if (file) {
                            if (file.size > 800 * 1024) alert("Max 800KB");
                            else onUpload(await fileToBase64(file));
                        }
                    }} accept={accept} className="hidden" />
                    {currentFile && accept.includes("image") && <img src={currentFile} alt="Preview" className="h-16 w-16 object-cover rounded-md border mt-1" />}
                </div>
            );
        };

        const ExportButton = ({ data, filename }) => {
            const handleExport = () => {
                if (!data || data.length === 0) return alert("No data");
                const headers = Object.keys(data[0]);
                const csv = [headers.join(','), ...data.map(row => headers.map(f => {
                    let v = row[f];
                    if (typeof v === 'object') v = ''; 
                    v = String(v || '').replace(/"/g, '""');
                    return v.search(/("|,|\n)/g) >= 0 ? `"${v}"` : v;
                }).join(','))].join('\r\n');
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' }));
                link.download = `${filename}.csv`;
                link.click();
            };
            return <button onClick={handleExport} className="flex items-center gap-2 text-indigo-600 hover:text-indigo-800 text-sm font-medium"><Icon name="download" size={16}/> Export Excel</button>;
        };

        // --- MAIN ---
        function RentalApp() {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const { convertToBS } = useNepaliDate();
            
            const [properties, setProperties] = useState([]);
            const [tenants, setTenants] = useState([]);
            const [invoices, setInvoices] = useState([]);
            
            const [editingId, setEditingId] = useState(null);
            const [showForm, setShowForm] = useState(false);
            const [formData, setFormData] = useState({});
            const [authError, setAuthError] = useState(null);
            
            const [isGenerating, setIsGenerating] = useState(false);
            const [generatedModalOpen, setGeneratedModalOpen] = useState(false);
            const [generatedText, setGeneratedText] = useState('');
            const [dashboardInsights, setDashboardInsights] = useState('');
            
            const [showShareHelp, setShowShareHelp] = useState(false);
            const [installPrompt, setInstallPrompt] = useState(null);

            // PWA Install Event
            useEffect(() => {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setInstallPrompt(e);
                });
            }, []);

            const installPWA = () => {
                if (!installPrompt) return;
                installPrompt.prompt();
                installPrompt.userChoice.then((choice) => {
                    if (choice.outcome === 'accepted') setInstallPrompt(null);
                });
            };

            // Auth
            const tryConnect = async () => {
                setAuthError(null);
                if (!auth) { setAuthError("Firebase SDK missing"); return; }
                try {
                    if (window.__initial_auth_token) await auth.signInWithCustomToken(window.__initial_auth_token);
                    else {
                        await auth.setPersistence(firebase.auth.Auth.Persistence.NONE);
                        await auth.signInAnonymously();
                    }
                } catch (err) { setAuthError("Connection Failed. Are you online?"); }
            };

            useEffect(() => {
                tryConnect();
                return auth && auth.onAuthStateChanged(u => { setUser(u); if(u) setAuthError(null); });
            }, []);

            // Data
            useEffect(() => {
                if (!user || !db) return;
                const path = db.collection('artifacts').doc(appId).collection('public').doc('data');
                const u1 = path.collection('properties').onSnapshot(s => setProperties(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const u2 = path.collection('tenants').onSnapshot(s => setTenants(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const u3 = path.collection('invoices').onSnapshot(s => setInvoices(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => { u1(); u2(); u3(); };
            }, [user]);

            // Save/Download Logic
            const downloadPortable = () => {
                const config = JSON.stringify(firebase.app().options);
                let html = document.documentElement.outerHTML;
                html = html.replace(/const firebaseConfig = [\s\S]*?};/, `const firebaseConfig = ${config};`);
                html = html.replace(/const appId = [\s\S]*?';/, `const appId = "${appId}";`);
                html = html.replace(/<div id="root">[\s\S]*?<\/div>/, '<div id="root"></div>');
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([html], {type: 'text/html'}));
                link.download = "RentalManager_PWA.html";
                link.click();
            };

            const handleSave = async (col) => {
                if (!user) return alert("Not Connected");
                const ref = db.collection('artifacts').doc(appId).collection('public').doc('data').collection(col);
                if (editingId) await ref.doc(editingId).update({...formData, updatedAt: firebase.firestore.FieldValue.serverTimestamp()});
                else await ref.add({...formData, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
                setShowForm(false); setEditingId(null); setFormData({});
            };

            const handleDelete = async (col, id) => {
                if (confirm("Delete?")) await db.collection('artifacts').doc(appId).collection('public').doc('data').collection(col).doc(id).delete();
            };

            const openForm = (data) => { setFormData(data); setEditingId(data.id || null); setShowForm(true); };

            // AI Features
            const runAI = async (prompt, field) => {
                setIsGenerating(true);
                const res = await callGemini(prompt);
                if (field) setFormData(p => ({...p, [field]: res}));
                else { setGeneratedText(res); setGeneratedModalOpen(true); }
                setIsGenerating(false);
            };

            const genLease = () => runAI(`Write a lease for Nepal. Tenant: ${formData.name}. Property: ${properties.find(p=>p.id===formData.propertyId)?.name}. Start: ${formData.entryDate}.`, 'leaseText');
            const genDesc = () => runAI(`Write rental listing for Nepal. ${formData.name}, ${formData.address}.`, 'description');
            const genReminder = (i) => runAI(`Write payment reminder SMS. Tenant: ${tenants.find(t=>t.id===i.tenantId)?.name}. Amount: ${i.amount}.`, null);
            const genInsights = () => {
                setIsGenerating(true);
                callGemini(`Analyze: ${properties.length} props, ${tenants.length} tenants.`).then(t => { setDashboardInsights(t); setIsGenerating(false); });
            };

            // Renders
            const Dashboard = () => (
                <div className="space-y-6 animate-fade-in">
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold">Dashboard</h2>
                        <button onClick={user ? undefined : tryConnect} className={`text-xs px-3 py-1 rounded-full flex items-center gap-1 font-bold ${user?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}`}>
                            <div className={`w-2 h-2 rounded-full ${user?'bg-green-500':'bg-red-500 animate-pulse'}`}></div>
                            {user ? 'Cloud Connected' : (authError ? 'Retry' : 'Connecting...')}
                        </button>
                    </div>

                    {!user && authError && <div className="bg-red-50 text-red-700 p-3 rounded text-sm border border-red-200">❌ {authError}. (Mobile users: Use web link, not file)</div>}

                    {/* App Install / Download Banner */}
                    <div className="bg-gradient-to-r from-indigo-50 to-purple-50 border border-indigo-200 p-6 rounded-xl shadow-sm">
                        <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                            <div>
                                <h3 className="font-bold text-indigo-900 text-lg flex gap-2"><Icon name="smartphone"/> Mobile App Setup</h3>
                                <p className="text-sm text-indigo-700 mt-1">To use on Android/iPhone, this file must be online.</p>
                            </div>
                            <div className="flex gap-2 flex-wrap justify-center">
                                <button onClick={() => setShowShareHelp(true)} className="bg-white text-indigo-600 border border-indigo-200 font-bold py-2 px-4 rounded-lg shadow-sm flex items-center gap-2"><Icon name="help-circle" size={18}/> Guide</button>
                                <button onClick={downloadPortable} className="bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg shadow-sm flex items-center gap-2"><Icon name="download" size={18}/> Get PWA File</button>
                                {installPrompt && <button onClick={installPWA} className="bg-pink-600 text-white font-bold py-2 px-4 rounded-lg shadow-sm flex items-center gap-2 animate-pulse"><Icon name="download-cloud" size={18}/> Install App</button>}
                            </div>
                        </div>
                    </div>

                    <div className="bg-purple-50 border border-purple-200 p-4 rounded-xl relative">
                        <div className="flex justify-between items-start mb-2"><h3 className="font-bold text-purple-900 flex gap-2"><Icon name="sparkles"/> AI Insights</h3><button onClick={genInsights} className="text-xs bg-purple-600 text-white px-3 py-1 rounded">Update</button></div>
                        <div className="text-sm text-purple-800 whitespace-pre-wrap">{dashboardInsights || "Click Update to analyze data..."}</div>
                    </div>

                    <div className="grid grid-cols-3 gap-2">
                        <div className="bg-white p-4 rounded border text-center">
                            <div className="text-gray-500 text-xs uppercase">Props</div>
                            <div className="text-2xl font-bold">{properties.length}</div>
                        </div>
                        <div className="bg-white p-4 rounded border text-center">
                            <div className="text-gray-500 text-xs uppercase">Tenants</div>
                            <div className="text-2xl font-bold">{tenants.length}</div>
                        </div>
                        <div className="bg-white p-4 rounded border text-center">
                            <div className="text-gray-500 text-xs uppercase">Pending</div>
                            <div className="text-2xl font-bold text-red-600">{invoices.filter(i=>i.status==='Pending').length}</div>
                        </div>
                    </div>
                </div>
            );

            const Properties = () => (
                <div className="space-y-4">
                    <div className="flex justify-between items-center"><h2 className="text-2xl font-bold">Properties</h2><div className="flex gap-2"><ExportButton data={properties} filename="props"/><button onClick={()=>openForm({})} className="bg-indigo-600 text-white px-3 py-2 rounded"><Icon name="plus" size={16}/></button></div></div>
                    {showForm && <div className="bg-white p-4 rounded shadow border mb-4 animate-fade-in-down"><div className="grid gap-2"><input className="border p-2 rounded" placeholder="Name" value={formData.name||''} onChange={e=>setFormData({...formData, name: e.target.value})}/><input className="border p-2 rounded" placeholder="Address" value={formData.address||''} onChange={e=>setFormData({...formData, address: e.target.value})}/><input type="number" className="border p-2 rounded" placeholder="Rent" value={formData.rent||''} onChange={e=>setFormData({...formData, rent: e.target.value})}/><FileUploader label="Photo" currentFile={formData.image} onUpload={b=>setFormData({...formData, image: b})}/><div className="flex gap-2"><button onClick={genDesc} className="text-xs bg-indigo-50 p-1 rounded text-indigo-600">✨ AI Write</button><textarea className="border p-2 rounded w-full h-16" placeholder="Desc" value={formData.description||''} onChange={e=>setFormData({...formData, description: e.target.value})}/></div></div><div className="mt-2 flex justify-end gap-2"><button onClick={()=>setShowForm(false)} className="bg-gray-100 px-3 py-1 rounded">Cancel</button><button onClick={()=>handleSave('properties')} className="bg-indigo-600 text-white px-3 py-1 rounded">Save</button></div></div>}
                    <div className="grid md:grid-cols-3 gap-4">{properties.map(p => (
                        <div key={p.id} className="bg-white rounded border overflow-hidden">
                            <div className="h-32 bg-gray-200 relative">{p.image?<img src={p.image} className="w-full h-full object-cover"/>:<div className="h-full flex items-center justify-center text-gray-400"><Icon name="image"/></div>}
                            <div className="absolute top-1 right-1 flex gap-1"><button onClick={()=>openForm(p)} className="bg-white p-1 rounded shadow"><Icon name="edit-2" size={14}/></button><button onClick={()=>handleDelete('properties', p.id)} className="bg-white p-1 rounded shadow text-red-500"><Icon name="trash-2" size={14}/></button></div></div>
                            <div className="p-3"><h3 className="font-bold">{p.name}</h3><p className="text-xs text-gray-500">{p.address}</p><p className="font-bold text-indigo-600">Rs. {p.rent}</p>
                            <div className="mt-2 border-t pt-2 text-xs text-green-700">{tenants.filter(t=>t.propertyId===p.id).map(t=><div key={t.id} className="flex gap-1 items-center"><Icon name="user" size={10}/> {t.name}</div>) || 'Vacant'}</div></div>
                        </div>
                    ))}</div>
                </div>
            );

            const Tenants = () => (
                <div className="space-y-4">
                    <div className="flex justify-between items-center"><h2 className="text-2xl font-bold">Tenants</h2><div className="flex gap-2"><ExportButton data={tenants} filename="tenants"/><button onClick={()=>openForm({})} className="bg-green-600 text-white px-3 py-2 rounded"><Icon name="plus" size={16}/></button></div></div>
                    {showForm && <div className="bg-white p-4 rounded shadow border mb-4 animate-fade-in-down"><div className="grid gap-2"><input className="border p-2 rounded" placeholder="Name" value={formData.name||''} onChange={e=>setFormData({...formData, name: e.target.value})}/><input className="border p-2 rounded" placeholder="Phone" value={formData.phone||''} onChange={e=>setFormData({...formData, phone: e.target.value})}/><select className="border p-2 rounded" value={formData.propertyId||''} onChange={e=>setFormData({...formData, propertyId: e.target.value})}><option value="">Select Property</option>{properties.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select><DualDatePicker label="Start" value={formData.entryDate||''} onChange={v=>setFormData({...formData, entryDate: v})}/><FileUploader label="Lease" currentFile={formData.leaseFile} onUpload={b=>setFormData({...formData, leaseFile: b})}/><div className="flex gap-2"><button onClick={genLease} className="text-xs bg-green-50 p-1 rounded text-green-600">✨ AI Draft</button><textarea className="border p-2 rounded w-full h-16" value={formData.leaseText||''} onChange={e=>setFormData({...formData, leaseText: e.target.value})}/></div></div><div className="mt-2 flex justify-end gap-2"><button onClick={()=>setShowForm(false)} className="bg-gray-100 px-3 py-1 rounded">Cancel</button><button onClick={()=>handleSave('tenants')} className="bg-green-600 text-white px-3 py-1 rounded">Save</button></div></div>}
                    <div className="bg-white rounded border overflow-x-auto"><table className="w-full text-left text-sm"><thead className="bg-gray-50"><tr><th className="p-3">Name</th><th className="p-3">Prop</th><th className="p-3">Start</th><th className="p-3 text-right">Act</th></tr></thead><tbody>{tenants.map(t=><tr key={t.id} className="border-t"><td className="p-3 font-medium">{t.name}<div className="text-xs text-gray-500">{t.phone}</div></td><td className="p-3">{properties.find(p=>p.id===t.propertyId)?.name||'-'}</td><td className="p-3">{t.entryDate}<div className="text-xs text-indigo-600">{convertToBS(t.entryDate)}</div></td><td className="p-3 flex justify-end gap-1">{t.leaseFile&&<a href={t.leaseFile} download className="p-1 bg-blue-50 text-blue-600 rounded"><Icon name="file-text" size={14}/></a>}<button onClick={()=>openForm(t)} className="p-1 bg-gray-100 rounded"><Icon name="edit-2" size={14}/></button><button onClick={()=>handleDelete('tenants', t.id)} className="p-1 bg-red-50 text-red-500 rounded"><Icon name="trash-2" size={14}/></button></td></tr>)}</tbody></table></div>
                </div>
            );

            const Invoices = () => (
                <div className="space-y-4">
                    <div className="flex justify-between items-center"><h2 className="text-2xl font-bold">Invoices</h2><div className="flex gap-2"><ExportButton data={invoices} filename="inv"/><button onClick={()=>openForm({status: 'Pending', date: new Date().toISOString().split('T')[0]})} className="bg-indigo-600 text-white px-3 py-2 rounded"><Icon name="plus" size={16}/></button></div></div>
                    {showForm && <div className="bg-white p-4 rounded shadow border mb-4 animate-fade-in-down"><div className="grid gap-2"><select className="border p-2 rounded" value={formData.tenantId||''} onChange={e=>{const t=tenants.find(x=>x.id===e.target.value);const p=t?properties.find(x=>x.id===t.propertyId):null;setFormData({...formData, tenantId: e.target.value, amount: p?p.rent:formData.amount})}}><option value="">Select Tenant</option>{tenants.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select><input type="number" className="border p-2 rounded" placeholder="Amount" value={formData.amount||''} onChange={e=>setFormData({...formData, amount: e.target.value})}/><DualDatePicker label="Date" value={formData.date||''} onChange={v=>setFormData({...formData, date: v})}/><select className="border p-2 rounded" value={formData.status} onChange={e=>setFormData({...formData, status: e.target.value})}><option value="Pending">Pending</option><option value="Paid">Paid</option></select><input className="border p-2 rounded" placeholder="Desc" value={formData.description||''} onChange={e=>setFormData({...formData, description: e.target.value})}/></div><div className="mt-2 flex justify-end gap-2"><button onClick={()=>setShowForm(false)} className="bg-gray-100 px-3 py-1 rounded">Cancel</button><button onClick={()=>handleSave('invoices')} className="bg-indigo-600 text-white px-3 py-1 rounded">Save</button></div></div>}
                    <div className="bg-white rounded border overflow-x-auto"><table className="w-full text-left text-sm"><thead className="bg-gray-50"><tr><th className="p-3">Date</th><th className="p-3">Tenant</th><th className="p-3">Amt</th><th className="p-3">Sts</th><th className="p-3 text-right">Act</th></tr></thead><tbody>{invoices.map(i=><tr key={i.id} className="border-t"><td className="p-3">{i.date}</td><td className="p-3">{tenants.find(t=>t.id===i.tenantId)?.name||'?'}</td><td className="p-3 font-bold">Rs.{i.amount}</td><td className="p-3"><span className={`px-1 rounded text-xs ${i.status==='Paid'?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}`}>{i.status}</span></td><td className="p-3 flex justify-end gap-1"><button onClick={()=>genReminder(i)} className="p-1 bg-indigo-50 text-indigo-600 rounded"><Icon name="sparkles" size={14}/></button><button onClick={()=>openForm(i)} className="p-1 bg-gray-100 rounded"><Icon name="edit-2" size={14}/></button><button onClick={()=>handleDelete('invoices', i.id)} className="p-1 bg-red-50 text-red-500 rounded"><Icon name="trash-2" size={14}/></button></td></tr>)}</tbody></table></div>
                </div>
            );

            // Help Modal
            const HelpModal = () => (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 animate-fade-in">
                    <div className="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 relative">
                        <button onClick={() => setShowShareHelp(false)} className="absolute top-4 right-4 text-gray-400"><Icon name="x"/></button>
                        <h3 className="text-xl font-bold mb-4 text-indigo-900">How to use on Phone (Forever Free)</h3>
                        <div className="space-y-3 text-sm text-gray-700">
                            <p className="bg-yellow-50 p-2 rounded text-yellow-800">⚠️ Android blocks local files from internet. You MUST upload this file to the web.</p>
                            <p><strong>Option 1: GitHub Pages (Recommended)</strong></p>
                            <ol className="list-decimal pl-5 space-y-1">
                                <li>Create a free account on <a href="https://github.com" target="_blank" className="underline text-blue-600">GitHub.com</a>.</li>
                                <li>Create a "New Repository" (name it anything).</li>
                                <li>Upload the <code>RentalManager_PWA.html</code> file you downloaded.</li>
                                <li>Go to Settings {'>'} Pages {'>'} Save.</li>
                                <li>It will give you a permanent link. Open that on your phone!</li>
                            </ol>
                            <p className="mt-2"><strong>Option 2: Static App (Easier)</strong></p>
                            <ul className="list-disc pl-5">
                                <li>Go to <a href="https://static.app" target="_blank" className="underline text-blue-600">Static.app</a> (Free tier).</li>
                                <li>Drag & drop the file there.</li>
                            </ul>
                        </div>
                        <button onClick={() => setShowShareHelp(false)} className="mt-6 w-full bg-indigo-600 text-white py-2 rounded font-bold">Got it</button>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-gray-50 pb-20 md:pb-0">
                    <div className="md:hidden bg-indigo-700 p-4 text-white flex justify-between shadow-md"><h1 className="font-bold text-xl flex gap-2"><Icon name="home"/> Rental App</h1></div>
                    <div className="flex">
                        <aside className="hidden md:flex flex-col w-64 bg-white border-r h-screen sticky top-0">
                            <div className="p-6 border-b"><h1 className="text-2xl font-bold text-indigo-700 flex gap-2"><Icon name="home"/> Rental Mgr</h1></div>
                            <nav className="flex-1 p-4 space-y-2">
                                {['dashboard','properties','tenants','invoices'].map(t => (
                                    <button key={t} onClick={()=>{setActiveTab(t);setShowForm(false)}} className={`w-full flex gap-3 px-4 py-3 rounded capitalize ${activeTab===t?'bg-indigo-50 text-indigo-700 font-bold':'text-gray-600 hover:bg-gray-50'}`}><Icon name={t==='dashboard'?'home':t==='properties'?'file-text':t==='tenants'?'users':'file-text'} size={20}/> {t}</button>
                                ))}
                            </nav>
                        </aside>
                        <main className="flex-1 p-4 md:p-8 overflow-y-auto min-h-screen">
                            {activeTab==='dashboard' && <Dashboard/>}
                            {activeTab==='properties' && <Properties/>}
                            {activeTab==='tenants' && <Tenants/>}
                            {activeTab==='invoices' && <Invoices/>}
                        </main>
                    </div>
                    
                    {/* Mobile Nav */}
                    <div className="md:hidden fixed bottom-0 w-full bg-white border-t flex justify-around py-3 safe-area-bottom z-50">
                        {['dashboard','properties','tenants','invoices'].map(t => (
                            <button key={t} onClick={()=>setActiveTab(t)} className={`flex flex-col items-center gap-1 ${activeTab===t?'text-indigo-600':'text-gray-500'}`}>
                                <Icon name={t==='dashboard'?'home':t==='properties'?'file-text':t==='tenants'?'users':'file-text'} size={20}/>
                                <span className="text-[10px] capitalize">{t.substr(0,4)}</span>
                            </button>
                        ))}
                    </div>

                    {showShareHelp && <HelpModal/>}
                    
                    {generatedModalOpen && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 animate-fade-in">
                            <div className="bg-white rounded-xl shadow-2xl max-w-lg w-full p-6 relative">
                                <h3 className="text-xl font-bold flex gap-2 text-indigo-700 mb-4"><Icon name="sparkles"/> AI Result</h3>
                                <div className="bg-gray-50 p-4 rounded border text-sm whitespace-pre-wrap max-h-96 overflow-y-auto">{generatedText}</div>
                                <div className="flex justify-end gap-2 mt-4"><button onClick={()=>copyToClipboard(generatedText)} className="bg-indigo-600 text-white px-4 py-2 rounded">Copy</button><button onClick={()=>setGeneratedModalOpen(false)} className="bg-gray-100 px-4 py-2 rounded">Close</button></div>
                            </div>
                        </div>
                    )}
                    
                    {isGenerating && <div className="fixed inset-0 bg-white/80 flex items-center justify-center z-50"><div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mb-4"></div></div>}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RentalApp />);
    </script>

</body></html>
